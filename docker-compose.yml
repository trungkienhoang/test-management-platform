version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: tmp_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tmp_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_management}
      MYSQL_USER: ${MYSQL_USER:-tmp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tmp_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptmp_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tmp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-tmp_user}:${MYSQL_PASSWORD:-tmp_password}@mysql:3306/${MYSQL_DATABASE:-test_management}
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tmp_web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
